name: Patch portal direction cards once

on:
  push:
    branches:
      - codex/aurora-visual-refinement

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/aurora-visual-refinement

      - name: Update portal direction cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('portal-prototype.html')
          html = path.read_text(encoding='utf-8')
          marker = '/* portal-direction-cards-v3 */'

          css = r'''
          /* portal-direction-cards-v3 */
          .directionGrid {
            gap: 16px;
            margin-top: 16px;
          }
          .directionCard {
            min-height: 295px;
            display: block;
            position: relative;
            overflow: hidden;
            padding: 28px;
            border: 0;
            border-radius: 16px;
            background: #fff;
            box-shadow: none;
            backdrop-filter: none;
            isolation: isolate;
            transition: transform .24s ease, box-shadow .24s ease;
          }
          .directionCard::before { display: none !important; }
          .directionCard::after {
            content: "";
            position: absolute;
            z-index: 0;
            pointer-events: none;
            transition: transform .3s ease;
          }
          .directionCard:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 34px rgba(21,36,48,.08);
          }
          .directionCardTop,
          .directionIcon,
          .directionKicker,
          .directionCta { display: none !important; }
          .directionCopy {
            position: relative;
            z-index: 2;
            max-width: 100%;
          }
          .directionCard h2 {
            max-width: 360px;
            margin: 0;
            color: #343434;
            font-size: 20px;
            line-height: 1.02;
            letter-spacing: -.035em;
            font-weight: 760;
            text-transform: uppercase;
          }
          .directionCard p {
            position: relative;
            z-index: 2;
            max-width: 370px;
            margin: 11px 0 0;
            color: #6f6f6f;
            font-size: 16px;
            line-height: 1.25;
          }
          .directionCard-archive::after {
            left: -2%;
            right: -3%;
            bottom: -16px;
            height: 205px;
            background: url("public/museum/notation-divider.svg") center bottom / 118% 100% no-repeat;
            opacity: .83;
            transform: rotate(-1.5deg);
            transform-origin: center;
          }
          .directionCard-museum::after {
            right: 4%;
            bottom: 10px;
            width: 72%;
            height: 80%;
            background: url("public/museum/hero-harp-poster-transparent.webp") right bottom / contain no-repeat;
            filter: drop-shadow(0 9px 8px rgba(37,39,44,.08));
          }
          .directionCard-science::after {
            right: -2px;
            bottom: -6px;
            width: 56%;
            height: 69%;
            background: url("public/portal/science-card-book.jpg") right bottom / contain no-repeat;
          }
          .directionCard-museum:hover::after,
          .directionCard-science:hover::after { transform: translateY(-2px); }
          .directionCard-archive:hover::after { transform: rotate(-1.5deg) translateY(-2px); }

          @media (max-width: 860px) {
            .directionCard { min-height: 260px; padding: 26px; }
            .directionCard h2 { max-width: 390px; font-size: 20px; }
            .directionCard p { font-size: 15px; }
            .directionCard-archive::after { height: 175px; }
            .directionCard-museum::after { width: 62%; }
            .directionCard-science::after { width: 48%; }
          }
          @media (max-width: 560px) {
            .directionGrid { gap: 12px; }
            .directionCard { min-height: 220px; padding: 20px; border-radius: 15px; }
            .directionCard h2 { max-width: 290px; font-size: 18px; }
            .directionCard p { max-width: 290px; margin-top: 8px; font-size: 13px; }
            .directionCard-archive::after {
              left: -10%; right: -10%; bottom: -18px; height: 148px;
              background-size: 132% 100%; opacity: .78;
            }
            .directionCard-museum::after { right: 1%; bottom: 6px; width: 65%; height: 72%; }
            .directionCard-science::after { right: -8px; bottom: -5px; width: 53%; height: 62%; }
          }
          '''

          if marker not in html:
              needle = '</style>\n</head>'
              if needle not in html:
                  raise SystemExit('Final style block not found')
              html = html.replace(needle, css + '\n</style>\n</head>', 1)

          html = html.replace(
              'Экспедиционные записи, исполнители, жанры и музыкальные традиции.',
              'Полевые записи 1966-2023 годов'
          )
          html = html.replace(
              'Каталог инструментов, 3D-модели, изображения и связанные фонограммы.',
              'Каталог инструментов, 3D-модели'
          )
          html = html.replace(
              'Публикации, исследователи, экспедиции и материалы лаборатории.',
              'Публикации, исследователи, экспедиции'
          )

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit updated portal
        shell: bash
        run: |
          if git diff --quiet -- portal-prototype.html; then
            echo "Portal cards are already updated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal-prototype.html
          git commit -m "Redesign portal section cards from updated mockup"
          git push origin HEAD:codex/aurora-visual-refinement
