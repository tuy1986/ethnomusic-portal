name: Fix portal direction cards v4

on:
  push:
    branches:
      - codex/aurora-visual-refinement

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/aurora-visual-refinement

      - name: Apply card patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal-prototype.html public/portal/science-card-book.png
          git rm .github/workflows/fix-portal-direction-cards-v4.yml
          git commit -m "Match portal direction cards to approved references"
          git push origin HEAD:codex/aurora-visual-refinement
