name: Fix portal direction cards v4

on:
  push:
    branches:
      - codex/aurora-visual-refinement

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/aurora-visual-refinement

      - name: Patch portal cards
        run: python3 .github/scripts/patch_portal_cards_v4.py

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Prepare transparent book image
        shell: bash
        run: |
          SRC="public/portal/science-card-book.jpg"
          DST="public/portal/science-card-book.png"
          BG=$(convert "$SRC" -format '%[pixel:p{0,0}]' info:)
          convert "$SRC" -alpha on -fuzz 16% -transparent "$BG" -trim +repage "$DST"
          test -s "$DST"

      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal-prototype.html public/portal/science-card-book.png
          git rm .github/workflows/fix-portal-direction-cards-v4.yml .github/scripts/patch_portal_cards_v4.py
          git commit -m "Match portal direction cards to approved references"
          git push origin HEAD:codex/aurora-visual-refinement
